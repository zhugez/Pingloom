name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
    # docs/media/brand contains a bundled SVG, so do not ignore all of docs/**.
    paths-ignore: ['**.md', 'CONTEXT.md']
  pull_request:
    paths-ignore: ['**.md', 'CONTEXT.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          # Linux distribution is paused (Coming soon); retain its source backend.
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      # Reproducible-lite: no checkout path in panic strings or debug paths.
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/pingloom
    steps:
      - uses: actions/checkout@v4
      - name: Pin build timestamps to the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # macOS ships one universal (Apple Silicon + Intel) app.
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build and test bundled Settings (no runtime Node)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Frontend checks and formatting (one platform)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npm --prefix ui run check
          npm --prefix ui test
          cargo fmt --all -- --check
      - name: Native-target tests
        run: |
          cargo nextest run --locked --all-targets
          cargo test --locked --doc
      - name: Native-target Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Windows installer and portable executable
        if: matrix.platform == 'windows'
        shell: bash
        run: ui/node_modules/.bin/tauri build --bundles nsis -- --locked
      - name: macOS universal application bundle
        if: matrix.platform == 'macos'
        run: ui/node_modules/.bin/tauri build --config tauri.macos.conf.json --target universal-apple-darwin --bundles app --no-default-features --features desktop,custom-protocol -- --locked
      - name: Stage Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir release
          cp target/release/pingloom.exe release/
          cp target/release/bundle/nsis/*-setup.exe release/
      - name: Stage macOS (ad-hoc signed, not notarized)
        if: matrix.platform == 'macos'
        run: |
          mkdir release
          app=target/universal-apple-darwin/release/bundle/macos/Pingloom.app
          test -f "$app/Contents/Resources/assets/emotes/facepalm.webp"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/pingloom" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$app" release/pingloom-macos-universal.zip
      - name: Windows runtime smoke test
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name U -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern uint RegisterWindowMessageW(string name);
          [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeoutW(IntPtr hwnd, uint msg, UIntPtr w, IntPtr l, uint flags, uint timeout, out UIntPtr result);
          '@
          $p = Start-Process target/release/pingloom.exe -PassThru
          Start-Sleep 10
          if ($p.HasExited) { throw "pingloom exited with code $($p.ExitCode)" }
          # Idle CPU/private/working set are warn-only; no desktop input during the sample.
          & ./tools/windows_idle_metrics.ps1 -ProcessId $p.Id -Out "$PWD/idle.json"
          # Top-level (not message-only) owner window, so broadcasts reach it.
          # PowerShell turns $null into "" for string arguments, so match the title.
          $hwnd = [W.U]::FindWindowW('pingloom-main', 'Pingloom')
          if ($hwnd -eq [IntPtr]::Zero) { throw 'owner window is not a top-level window' }
          $r = [UIntPtr]::Zero
          # TaskbarCreated (tray re-add) and WM_DISPLAYCHANGE (overlay rebuild).
          foreach ($msg in @([W.U]::RegisterWindowMessageW('TaskbarCreated'), 0x7E)) {
            if ([W.U]::SendMessageTimeoutW($hwnd, $msg, [UIntPtr]::Zero, [IntPtr]::Zero, 2, 5000, [ref]$r) -eq [IntPtr]::Zero) { throw "message $msg not handled within 5 s" }
          }
          Start-Sleep 2
          if ($p.HasExited) { throw "pingloom exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - name: Windows gesture smoke test
        if: matrix.platform == 'windows'
        shell: powershell
        run: tools/windows_gesture_smoke.ps1 -Exe target/release/pingloom.exe -Dir $env:RUNNER_TEMP -TopMost
      - name: macOS runtime smoke test (both architectures)
        if: matrix.platform == 'macos'
        run: |
          binary=target/universal-apple-darwin/release/bundle/macos/Pingloom.app/Contents/MacOS/pingloom
          for arch in arm64 x86_64; do
            # Accessibility is not granted on CI: the app must prompt and keep waiting.
            arch -$arch "$binary" > "smoke-$arch.log" 2>&1 &
            pid=$!
            sleep 15
            if ! kill -0 $pid; then cat "smoke-$arch.log"; echo "Pingloom ($arch) exited early"; exit 1; fi
            kill $pid; wait $pid || true
            echo "Pingloom ($arch) stayed running"; cat "smoke-$arch.log"
          done
      - name: Release decode benchmark
        shell: bash
        run: PINGLOOM_BENCH_OUT=bench.json cargo nextest run --locked --cargo-profile bench-ci --run-ignored only -E 'test(decode_benchmark)'
      - name: Release render benchmark (offscreen; no desktop input)
        shell: bash
        run: PINGLOOM_RENDER_OUT=render.json cargo nextest run --locked --cargo-profile bench-ci --run-ignored only -E 'test(render_benchmark)'
      - name: Test performance gate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          $py -m unittest discover -s tools -p 'test_perf_gate.py'
      - name: Performance gate (sizes/counters fail >5%; timing/RAM warn >10%)
        shell: bash
        run: |
          binary=target/release/pingloom
          if [ "$RUNNER_OS" = macOS ]; then binary=target/universal-apple-darwin/release/pingloom; fi
          if [ "$RUNNER_OS" = Windows ]; then binary=$binary.exe; py=python; else py=python3; fi
          extras=(render.json)
          if [ "$RUNNER_OS" = Windows ]; then extras+=(idle.json); fi
          PINGLOOM_BENCH_PROFILE=bench-ci $py tools/perf_gate.py ${{ matrix.platform }} "$binary" bench.json "release/perf-${{ matrix.platform }}.json" "${extras[@]}"
      - name: Record build provenance
        shell: bash
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo "SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
            rustc -vV
            echo
            (cd release && { sha256sum * 2>/dev/null || shasum -a 256 *; })
          } > BUILD_INFO.txt
          mv BUILD_INFO.txt "release/BUILD_INFO-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pingloom-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
          retention-days: 14
