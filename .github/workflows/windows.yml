name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22 (build-time only)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui
      - name: Check frontend types
        run: npm run check
        working-directory: ui
      - name: Test frontend logic
        run: npm test
        working-directory: ui
      - name: Build frontend bundle
        run: npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Windows target
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Lint Windows target
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build portable executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin pingloom
      - uses: actions/upload-artifact@v4
        with:
          name: pingloom-windows-x64
          path: target/x86_64-pc-windows-msvc/release/pingloom.exe
          if-no-files-found: error
          retention-days: 14
