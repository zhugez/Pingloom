name: Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test Windows target
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Lint Windows target
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build portable executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin lolping
      - uses: actions/upload-artifact@v4
        with:
          name: lolping-windows-x64
          path: target/x86_64-pc-windows-msvc/release/lolping.exe
          if-no-files-found: error
          retention-days: 14
